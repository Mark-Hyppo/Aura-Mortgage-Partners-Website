<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <rect width="48" height="48" rx="10" fill="#002050"/>
  <!-- The logo's open ring: navy circle closed by a gold arc. -->
  <circle cx="24" cy="22" r="14.5" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.28"/>
  <path d="M24 7.5A14.5 14.5 0 0 1 38.5 22" fill="none" stroke="#D0A030" stroke-width="2.6" stroke-linecap="round"/>
  <!-- Rooftop A: the peak, then the eave line that reads as a house. -->
  <path d="M24 11.5 31.5 29.5 24 24.5 16.5 29.5Z" fill="#ffffff"/>
  <path d="M14.5 27.5 24 20.5 33.5 27.5" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round" opacity="0.92"/>
  <rect x="21.6" y="30.2" width="4.8" height="4.8" rx="0.6" fill="#D0A030"/>
</svg>
